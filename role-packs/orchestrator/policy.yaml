# Orchestrator policy — WIP, budgets, forbidden actions, HITL triggers.
version: 0
role: orchestrator

wip:
  # The number that stops this system producing more branches than anyone
  # can review. Reviewers are the bottleneck, not agents.
  #
  # Raised 3 -> 6 on human instruction (2026-09-03: "build the whole thing
  # quickly"). The reasoning above still holds and this is the trade being
  # made knowingly: six concurrent sessions produce PRs faster than one
  # reviewer clears them, so the queue moves to review instead of to
  # dispatch. Lower it back to 3 when the backlog is no longer the
  # constraint.
  limit: 6
  # What counts as in flight. Deliberately the label the dispatcher sets
  # when a session actually starts, not the orchestrator's intent.
  counts: [status:in-progress]
  per_role:
    # Optional caps under the global limit. Absent means "no extra cap".
    developer: 4
    qa: 2
    product-manager: 1
    architect: 2
    techwriter: 2
    # One at a time. A pipeline change reviewed in parallel with another
    # pipeline change is how two gates weaken at once.
    devops: 1
    # Same reasoning as devops: a governance change reviewed in parallel
    # with another governance change is how two policies drift at once.
    delivery-lead: 1

refill:
  # When the ready queue drops to or below this, the backlog needs refilling
  # and the PM role is dispatched to do it. The board ran dry once already:
  # every Phase 0 story closed, the loop correctly found nothing eligible,
  # and delivery became rate-limited on a human writing stories.
  #
  # A floor rather than a calendar. Refinement triggered on a schedule
  # writes stories nobody asked for; triggered on an emptying board it
  # writes the ones that are actually needed.
  ready_floor: 1
  # What the PM may refine toward. requirements/coverage.yaml's unsatisfied
  # criteria are the fence — it bounds scope to work the programme has
  # already committed to, rather than whatever the model finds interesting.
  scope_source: requirements/coverage.yaml
  # The PM proposes; it does not self-approve. policies/gates.yaml decides
  # which proposals need a person, and enforces it by who applied the label.
  proposes_only: true
  role: product-manager

routing:
  # v0 routes on labels, which works with any tracker. The GitHub Projects
  # "Role" field would need a project-scoped token; see the story's PR.
  field: label
  prefix: "role:"
  supported: [developer, qa, product-manager, devops, architect, techwriter, delivery-lead,
              security, operations]
  # An item without one of these is unrefined, not "probably a dev story".
  default: null

eligibility:
  # Fallback only, for a role pack that declares no dispatchable_from of
  # its own (#79) — not the rule every role is checked against. The rule
  # is each role's own pack.yaml:dispatchable_from, read the way
  # dispatch.yml's guard reads it.
  require_labels: [status:ready]
  # qa:rejected is deliberately absent (#79). A rejected item cannot reach
  # status:ready for role:developer, or status:in-review for role:qa,
  # without a human moving it there — dispatchable_from is already the
  # gate. Excluding qa:rejected here on top of that blocked the very
  # redispatch "fresh assignment" is supposed to mean: a human resets a
  # fixed story to status:ready and the loop picks it back up.
  exclude_labels: [needs-human, status:blocked]
  require_open: true

budgets:
  # The loop itself is cheap; these bound a session dispatched *as* the
  # orchestrator, which only happens when a human asks it to reason about
  # the board rather than just run the selection.
  turns: 10
  # The loop itself is cheap; this bounds a session dispatched *as* the
  # orchestrator, which only happens when a human asks it to reason.
  cost_usd: 1.00          # the ceiling: a breach here escalates
  tokens: 60000            # tripwire only — reported, never a breach
  wall_clock_minutes: 10
  max_retries: 1
  on_breach: escalate

forbidden:
  - writing_source_code
  - writing_tests
  - push_to_default_branch
  - force_push
  - merging_any_pull_request
  - setting_status_in_progress          # the dispatcher owns that transition
  - removing_needs_human
  - removing_status_blocked
  - removing_qa_verdicts
  - raising_its_own_wip_limit
  - dispatching_items_without_a_role
  - editing_policies_directory
  - editing_other_role_packs

write_scope:
  allow:
    - "role-packs/orchestrator/**"
    # PRD §3 gives ceremonies to this role. No pack owned the directory,
    # which is why it does not exist yet — the first ceremony to need a
    # declaration file will create it.
    - "ceremonies/**"
  deny:
    - "src/**"
    - "tests/**"
    - "policies/**"
    - ".github/**"
  # Beyond files: dispatching workflows, and comments on work items.

hitl_triggers:
  - nothing_eligible_while_items_sit_ready
  - wip_limit_permanently_full
  - every_eligible_item_missing_a_role
  - budget_breach

escalation:
  template: role-packs/orchestrator/templates/escalation-comment.md
  label: needs-human
  ladder:
    - retry
    - alternate_approach
    - alternate_harness
    - human

identity:
  bot_account: foundry-orchestrator-bot
  provisioned: false
  blocked_on: human
