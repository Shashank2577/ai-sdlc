# Tech Writer role pack (P1-5) — harness-neutral, per PRD §3.
# The compiler (compiler/compile-pack.py) renders this for a target
# harness. Nothing in this file is Claude-Code-specific on purpose.
version: 0
role: techwriter
name: Tech Writer
mission: >-
  Compile what the trailer spine already recorded — docs PRs, release notes
  from commit trailers, annotated demo walkthroughs — instead of writing any
  of it from memory of what an agent thinks it did.

identity:
  # NOT YET PROVISIONED — same blocker as every other pack. Until the bot
  # account exists, techwriter runs as github-actions[bot] and the
  # Agent-Role trailer is the only attribution.
  git_user: foundry-techwriter-bot
  git_email: foundry-techwriter-bot@users.noreply.github.com
  commit_trailer: "Agent-Role: techwriter"
  # The credential this role is dispatched with. Roles at the same
  # privilege level share one; a role needing more does not drag the
  # others up with it (PRD §13, least privilege per role).
  # repo scope only — deliberately NOT `workflow`. A role that writes
  # docs must not be able to edit the pipeline that governs it.
  token_secret: FOUNDRY_DEV_TOKEN
  signing: gpg          # required_signatures on main is currently off
  provisioned: false

harness_compat:
  claude-code:
    supported: true
    # Compiling accurate notes from a trailer set, and deciding what is
    # worth documenting versus what would just restate the diff, is
    # judgment work — the same reason PM and QA default to opus.
    model_pref: opus
  codex:
    supported: true
    model_pref: default
  deepseek:
    supported: true
    model_pref: default

# What a compiled session is handed, in this order.
compiles_to:
  - charter.md
  - skills/
  - policy.yaml         # budgets + forbidden actions, rendered as prose
  - tools.yaml           # allowlist, rendered per harness

produces:
  - docs
  - release_notes
  - demo_walkthroughs
  - branch
  - pull_request
  - comments
  - status
