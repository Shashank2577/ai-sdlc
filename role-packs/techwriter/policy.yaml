# Tech Writer policy — budgets, forbidden actions, human-in-the-loop
# triggers. PRD §13. Budgets here are the source of truth; the dispatcher
# reads them (wired in P0-7).
version: 0
role: techwriter

budgets:
  # Per work item, per session. Docs work reads a lot of history (git log,
  # merged PRs, prior docs) but writes prose, not code — closer to PM's
  # refinement budget than the developer's implementation one.
  turns: 40
  cost_usd: 3.50          # the ceiling: a breach here escalates
  tokens: 275000            # tripwire only — reported, never a breach
  wall_clock_minutes: 30
  max_retries: 2
  # What happens at the ceiling: never a silent stop.
  on_breach: escalate      # pause work, apply needs-human, post spend summary

forbidden:
  # Structural — branch protection enforces these regardless of intent.
  - push_to_default_branch
  - force_push
  - branch_deletion
  - merging_own_pull_request
  # Scope — enforced by review and by CODEOWNERS routing.
  - editing_branch_protection
  - editing_repository_settings
  - editing_secrets
  - editing_policies_directory        # policies/** is delivery-lead owned
  - editing_other_role_packs
  - editing_src_or_tests              # docs describe the code; never change it
  - editing_ci_pipelines              # DevOps owns .github/workflows/
  - rewriting_published_history
  # Behavioral — the failure mode this role exists to prevent (see the
  # house rule in charter.md): docs and release notes that restate the
  # code, or that come from an agent's recollection instead of the record.
  - writing_release_notes_not_sourced_from_commit_trailers
  - documenting_behavior_without_reading_the_current_code

write_scope:
  # Everything outside this list needs a human or another role.
  allow:
    - "docs/**"
    - "role-packs/techwriter/**"
  deny:
    - "src/**"
    - "tests/**"
    - "scripts/**"
    - "compiler/**"
    - "policies/**"
    - ".github/**"
    - "prds/**"
    - "requirements/**"
    - "role-packs/!(techwriter)/**"

hitl_triggers:
  # Conditions that end the session in an escalation rather than a PR.
  - commit_trailers_missing_or_malformed_for_the_range
  - change_requires_out_of_scope_write
  - missing_credential_or_permission
  - budget_breach
  - three_failed_attempts_at_same_approach

escalation:
  template: role-packs/techwriter/templates/escalation-comment.md
  label: needs-human
  # Ladder per PRD §13. v0 implements retry and human; alternate-harness
  # arrives with the second harness in Phase 3.
  ladder:
    - retry
    - alternate_approach        # must state what will be done differently
    - alternate_harness         # not available in single-harness mode
    - human

identity:
  # Blocking on a human action, stated so it cannot be forgotten:
  # provision the foundry-techwriter-bot machine account, add its signing
  # key, scope its PAT to contents+pull-requests, then flip pack.yaml
  # identity.provisioned to true and turn on required_signatures for main.
  bot_account: foundry-techwriter-bot
  provisioned: false
  blocked_on: human
