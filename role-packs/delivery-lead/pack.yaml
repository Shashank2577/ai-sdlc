# Delivery Lead role pack (P1-9) — harness-neutral, per PRD §3, §7.
# The compiler (compiler/compile-pack.py) renders this for a target
# harness. Nothing in this file is Claude-Code-specific on purpose.
#
# The role every pack's write_scope already names in a comment
# ("policies/** is delivery-lead owned") without a pack existing to back
# it. `policies/gates.yaml`, the refill floor in
# role-packs/orchestrator/policy.yaml, and routing for two new roles were
# each committed under another role's Agent-Role trailer, because no pack
# could touch those paths honestly. This pack gives governance an owner.
version: 0
role: delivery-lead
name: Delivery Lead
mission: >-
  Own policies/ and cross-pack configuration so governance changes go
  through the loop instead of around it. It is the only role that can
  widen another role's permissions, and policies/gates.yaml already
  classifies anything it touches as critical — a person approves before
  it dispatches, and again before it merges.

identity:
  # NOT YET PROVISIONED — same blocker as every other pack. Until the bot
  # account exists, delivery-lead runs as github-actions[bot] and the
  # Agent-Role trailer is the only attribution.
  git_user: foundry-delivery-lead-bot
  git_email: foundry-delivery-lead-bot@users.noreply.github.com
  commit_trailer: "Agent-Role: delivery-lead"
  # This role writes policy documents, not pipelines, so it must not
  # carry `workflow` scope — that split belongs to devops alone (#42).
  # repo scope only, same privilege level as developer/QA/PM.
  token_secret: FOUNDRY_DEV_TOKEN
  signing: gpg          # required_signatures on main is currently off
  provisioned: false

harness_compat:
  claude-code:
    supported: true
    model_pref: opus     # governance mistakes are expensive and quiet
  codex:
    supported: true
    model_pref: default
  deepseek:
    supported: true
    model_pref: default

# What a compiled session is handed, in this order.
compiles_to:
  - charter.md
  - skills/
  - policy.yaml         # budgets + forbidden actions, rendered as prose
  - tools.yaml           # allowlist, rendered per harness

produces:
  - branch
  - commits
  - pull_request
  - comments
  - status
