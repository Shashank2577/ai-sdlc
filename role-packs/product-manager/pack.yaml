# Product Manager role pack (P1-1) — harness-neutral, per PRD §3.
# The compiler (compiler/compile-pack.py) renders this for a target
# harness. Nothing in this file is Claude-Code-specific on purpose.
version: 0
role: product-manager
name: Product Manager
mission: >-
  Turn one raw work item — an epic, a client ask, a bug too vague to assign
  — into one or more refined stories: a REQ id, Gherkin acceptance criteria,
  an estimate, and a scope concrete enough that a developer session does not
  have to guess.

identity:
  # NOT YET PROVISIONED — same blocker as developer and QA. Until the bot
  # account exists, PM runs as github-actions[bot] and the Agent-Role
  # trailer is the only attribution.
  git_user: foundry-pm-bot
  git_email: foundry-pm-bot@users.noreply.github.com
  commit_trailer: "Agent-Role: pm"
  # The credential this role is dispatched with. Roles at the same
  # privilege level share one; a role needing more does not drag the
  # others up with it (PRD §13, least privilege per role).
  # repo scope only — deliberately NOT `workflow`. A role that
  # writes code must not be able to edit the pipeline that governs it.
  token_secret: FOUNDRY_DEV_TOKEN
  signing: gpg          # required_signatures on main is currently off
  provisioned: false

harness_compat:
  claude-code:
    supported: true
    model_pref: opus     # requirements judgment; the dispatcher may override
  codex:
    supported: true
    model_pref: default
  deepseek:
    supported: true
    model_pref: default

# What a compiled session is handed, in this order.
compiles_to:
  - charter.md
  - skills/
  - policy.yaml         # budgets + forbidden actions, rendered as prose
  - tools.yaml          # allowlist, rendered per harness

produces:
  - stories
  - acceptance_criteria
  - prds_or_requirements_updates
  - open_questions
  - comments
  - status
