# Developer policy — budgets, forbidden actions, human-in-the-loop triggers.
# PRD §13. Budgets here are the source of truth; the dispatcher reads them
# (wired in P0-7). Until then the dispatcher's max_turns input is the only
# enforced limit.
version: 0
role: developer

budgets:
  # Per work item, per session.
  # 90, from five sessions. A feature story finished in 23 turns (#22);
  # role packs ran 45, 48, 61 and 67 (#49, #39, #64, #50), so 60 sat in the
  # middle of that distribution and killed half of them. Writing a pack is
  # seven files and ~500 lines.
  #
  # The variance is really per story type, not per role — one number cannot
  # express both a 23-turn feature and a 67-turn pack. dispatch.yml's
  # max_turns input already overrides per dispatch, which is the better
  # lever once anyone is choosing it deliberately.
  turns: 90
  cost_usd: 5.00          # the ceiling: a breach here escalates
  tokens: 400000            # tripwire only — reported, never a breach
  wall_clock_minutes: 45
  max_retries: 2
  # What happens at the ceiling: never a silent stop.
  on_breach: escalate      # pause work, apply needs-human, post spend summary

forbidden:
  # Structural — branch protection enforces these regardless of intent.
  - push_to_default_branch
  - force_push
  - branch_deletion
  - merging_own_pull_request
  # Scope — enforced by review and by CODEOWNERS routing.
  - editing_branch_protection
  - editing_repository_settings
  - editing_secrets
  - editing_policies_directory        # policies/** is delivery-lead owned
  - editing_other_role_packs
  - editing_ci_pipelines            # DevOps owns .github/workflows/
  - rewriting_published_history

write_scope:
  # Everything outside this list needs a human or another role.
  allow:
    - "src/**"
    - "tests/**"
    - "docs/**"
    - "scripts/**"
    - "compiler/**"
    # Written by developer sessions since #104/#112 (9 of the last 10
    # commits touching it, `Agent-Role: developer`) but never declared —
    # a gap `scripts/check-story-scope.py` (#168) surfaced by flagging
    # every dashboard story as unscoped for every role, itself included.
    - "dashboards/**"
    # Same gap as dashboards/**, found the same way (#190): written by
    # developer sessions (#162) but never declared, so #168's check would
    # flag every future portal story as out-of-scope for the role that
    # actually owns it. `portal/build.py` is application code in the same
    # shape as `dashboards/*.py` — it belongs with the role that writes
    # code, not with product-manager (prds/requirements) or techwriter
    # (docs describe code, they don't ship it).
    - "portal/**"
    # Same gap again, same PR (#190): written by developer sessions
    # (#135, #166) but never declared. `adapters/` is application code —
    # tracker/memory client implementations and their contract tests —
    # not policy, not a role pack, not CI.
    - "adapters/**"
    - "role-packs/developer/**"
  deny:
    # PRD §3 assigns .github/workflows/ to DevOps. A role that writes code
    # must not be able to edit the pipeline that reviews, budgets and
    # dispatches it. This was allowed here once, with the comment
    # "DevOps-adjacent; cross-reviewed" — which was a rationalisation.
    - ".github/**"
    - "infra/**"
    - "policies/**"
    - ".github/CODEOWNERS"
    - "prds/**"
    - "requirements/**"
    - "role-packs/!(developer)/**"

hitl_triggers:
  # Conditions that end the session in an escalation rather than a PR.
  - acceptance_criteria_contradictory
  - acceptance_criteria_unmeetable
  - change_requires_out_of_scope_write
  - missing_credential_or_permission
  - budget_breach
  - three_failed_attempts_at_same_approach

escalation:
  template: role-packs/developer/templates/escalation-comment.md
  label: needs-human
  # Ladder per PRD §13. v0 implements retry and human; alternate-harness
  # arrives with the second harness in Phase 3.
  ladder:
    - retry
    - alternate_approach        # must state what will be done differently
    - alternate_harness         # not available in single-harness mode
    - human

identity:
  # Blocking on a human action, stated so it cannot be forgotten:
  # provision the foundry-dev-bot machine account, add its signing key,
  # scope its PAT to contents+pull-requests, then flip pack.yaml
  # identity.provisioned to true and turn on required_signatures for main.
  bot_account: foundry-dev-bot
  provisioned: false
  blocked_on: human
