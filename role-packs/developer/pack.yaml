# Developer role pack (P0-3) — harness-neutral, per PRD §3.
# The compiler (compiler/compile-pack.py) renders this for a target
# harness. Nothing in this file is Claude-Code-specific on purpose.
version: 0
role: developer
name: Developer
mission: >-
  Turn a refined work item into a reviewable pull request, with provenance
  attached to every commit.

# States the dispatch guard accepts this role from (#67). Explicit rather
# than relying on the compiler's default, so a later change to that
# default cannot silently change who this role is dispatched to review.
dispatchable_from:
  - status:ready

identity:
  # The bot account that should author and sign this role's commits.
  # NOT YET PROVISIONED — see role-packs/developer/policy.yaml:identity.
  # Until it exists the dispatcher runs as github-actions[bot] and the
  # Agent-Role trailer is the only attribution. That is a known gap,
  # tracked, not papered over.
  git_user: foundry-dev-bot
  git_email: foundry-dev-bot@users.noreply.github.com
  commit_trailer: "Agent-Role: developer"
  # The credential this role is dispatched with. Roles at the same
  # privilege level share one; a role needing more does not drag the
  # others up with it (PRD §13, least privilege per role).
  # repo scope only — deliberately NOT `workflow`. A role that
  # writes code must not be able to edit the pipeline that governs it.
  token_secret: FOUNDRY_DEV_TOKEN
  signing: gpg          # required_signatures on main is currently off
  provisioned: false

harness_compat:
  claude-code:
    supported: true
    model_pref: opus     # implementation work; the dispatcher may override
  codex:
    supported: true
    model_pref: default
  deepseek:
    supported: true
    model_pref: default

# What a compiled session is handed, in this order.
compiles_to:
  - charter.md
  - skills/
  - policy.yaml         # budgets + forbidden actions, rendered as prose
  - tools.yaml          # allowlist, rendered per harness

produces:
  - branch
  - commits
  - pull_request
  - comments
  - status
