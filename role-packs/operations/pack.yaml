# Operations role pack (P4-5) — harness-neutral, per PRD §3.
#
# Prior art: awslabs/aidlc-workflows names an `aidlc-operations-agent` and
# an `aidlc-pipeline-deploy-agent` separately, in a fourteen-role roster
# built for a human-gated 33-stage flow. This pack borrows the charter —
# someone whose job is what happens after a merge, distinct from the role
# that owns the pipeline itself — not the roster; see security/pack.yaml
# for the same note.
version: 0
role: operations
name: Operations
mission: >-
  Decide whether a merged change is safe to promote up the environment
  ladder (policies/environments.yaml), whether its rollback plan is real
  rather than assumed, and what a failure at each tier — especially prod —
  actually means: blast radius, who is paged, what "safe" looks like.

# There is no post-merge, pre-promotion dispatch stage in this system yet
# (see charter.md — that is the same kind of gap security's enforcement
# is). Reviewing at status:in-review, alongside QA and security, is the
# only stage that exists today; it reviews the rollback plan and blast
# radius the PR proposes before the merge that would make them real.
dispatchable_from:
  - status:in-review

identity:
  # NOT YET PROVISIONED — same blocker as every other pack. Until the bot
  # account exists, operations runs as github-actions[bot] and the
  # Agent-Role trailer is the only attribution.
  git_user: foundry-operations-bot
  git_email: foundry-operations-bot@users.noreply.github.com
  commit_trailer: "Agent-Role: operations"
  # repo scope only — deliberately NOT `workflow`. Distinct from devops,
  # which owns the pipeline and infra/**; operations judges what the
  # pipeline is about to do, and does not need to edit it to do that.
  token_secret: FOUNDRY_DEV_TOKEN
  signing: gpg
  provisioned: false

harness_compat:
  claude-code:
    supported: true
    model_pref: opus     # a wrong prod-readiness call is expensive and quiet
  codex:
    supported: true
    model_pref: default
  deepseek:
    supported: true
    model_pref: default

compiles_to:
  - charter.md
  - skills/
  - policy.yaml
  - tools.yaml

produces:
  - readiness_report        # comment on the work item: go / not-ready / why
  - bug_issues               # rollback or blast-radius gaps outside scope
  - comments
  - status
