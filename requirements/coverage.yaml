# What each requirement would take to actually be satisfied.
#
# The traceability matrix answers "did work carrying this REQ trailer reach
# main through a merged PR". That is a *trace*, not a completion — REQ-004
# went green on a commit that mentioned Jira while no Jira adapter exists.
# A client reading that page would be misled.
#
# So each requirement declares machine-checkable criteria here. The criteria
# are reviewed like code; the result is computed. Satisfaction is the
# fraction of a requirement's checks that pass — never a human's opinion of
# how done something feels.
#
# Check kinds:
#   exists: <path>            a file or directory is present
#   glob:   <pattern>         at least one path matches
#   count:  {glob, at_least}  at least N paths match
#   grep:   {glob, pattern}   at least one matching file contains the pattern
version: 0

# Thresholds for claims the status page renders as prose rather than a
# checkbox, so the number a reader would want to argue with lives here
# instead of buried in a render function.
#
# REQ-014's `delivered_by_agent: 1` check is a floor for "the machinery
# works at all" — one merged PR from a dispatched session. That is not
# the same claim as "self-hosting is how this programme actually ships",
# which needs more than one data point. `machinery_at_least` gates the
# weaker claim; `practice_at_least` gates the stronger one. Ten is chosen
# as an order of magnitude past the floor — enough that a single lucky
# run cannot pass it, deliberately conservative rather than tuned to
# whatever the count happens to be today.
policy:
  self_hosting:
    machinery_at_least: 1
    practice_at_least: 10

requirements:
  REQ-001:
    summary: Coordination through the tracker; every action leaves an artifact
    checks:
      - {exists: .github/workflows/dispatch.yml}
      - {grep: {glob: .github/workflows/dispatch.yml, pattern: "gh issue comment"}}
      - {exists: .github/workflows/project-sync.yml}

  REQ-002:
    summary: >-
      Harness-neutral role packs, with attribution by per-role credential
      tier and the Agent-Role trailer
    checks:
      - {exists: compiler/compile-pack.py}
      - {count: {glob: "role-packs/*/pack.yaml", at_least: 8}}   # PRD §3 names 8 roles
      # Was `provisioned: true` — a target the programme has now decided
      # against, so it scored 33% forever against work nobody intended to
      # do. The human decision (2026-09-03) was to keep attribution by
      # credential tier plus the Agent-Role trailer, and to reject both
      # per-role machine accounts and commit signing until an external
      # auditor actually needs them. Recorded as an ADR; this check now
      # tests the thing that was decided.
      #
      # The tier boundary is the one that matters and the one the human
      # specified: a code-writing role cannot reach the pipeline
      # credential. Six roles share FOUNDRY_DEV_TOKEN, devops alone holds
      # FOUNDRY_DEVOPS_TOKEN, orchestrator holds FOUNDRY_TOKEN.
      - {grep: {glob: "role-packs/devops/pack.yaml", pattern: "FOUNDRY_DEVOPS_TOKEN"}}
    notes: >-
      All 8 packs exist. Attribution is by credential tier and the Agent-Role
      trailer, not by signature — a decision, not a gap. Distinct per-role bot
      identities were considered and rejected for v0; see adrs/.

  REQ-003:
    summary: Harness adapter — Claude Code, Codex, DeepSeek behind one contract
    checks:
      - {exists: .github/workflows/dispatch.yml}
      - {grep: {glob: compiler/compile-pack.py, pattern: "def compile_claude_code"}}
      - {grep: {glob: compiler/compile-pack.py, pattern: "def compile_codex"}}
    notes: One harness is implemented. The pack format is neutral; the compiler is not.

  REQ-004:
    summary: Tracker adapter — GitHub Projects and Jira swappable
    checks:
      - {exists: scripts/sync-project.py}
      - {exists: adapters/tracker/github}
      - {exists: adapters/tracker/jira}
    notes: No adapter layer exists; the sync talks to GitHub directly.

  REQ-005:
    summary: Git-native traceability spine
    checks:
      - {exists: scripts/dod-check.sh}
      - {exists: dashboards/build.py}
      - {exists: .github/CODEOWNERS}
      - {grep: {glob: policies/dod.yaml, pattern: "commit_trailers"}}

  REQ-006:
    summary: All five ceremonies run autonomously and end in artifacts
    # The checks used to be four `ceremonies/*.yaml` declarations plus one
    # workflow. #132 wrote all five declarations, so REQ-006 jumped to
    # 5/5 — 100% — while `planning` and `review` had no workflow at all
    # and could not run. A declaration is a contract, not a ceremony.
    #
    # That is the third proxy on this page to flatter the programme, after
    # a gate policy merely existing and `environment:` in the Pages deploy
    # both counted for REQ-010. The pattern is always the same: the check
    # tests an artefact that accompanies the work instead of the work.
    # The requirement says *run* autonomously, so the checks test the
    # thing that runs.
    checks:
      - {glob: ".github/workflows/standup.yml"}
      - {glob: ".github/workflows/refinement.yml"}
      - {glob: ".github/workflows/retro.yml"}
      - {glob: ".github/workflows/planning.yml"}
      - {glob: ".github/workflows/review.yml"}
      # The declarations still count for one, because the contract they
      # state is real progress — but for one, not for five.
      - {count: {glob: "ceremonies/*.yaml", at_least: 5}}
    notes: >-
      Standup, refinement and retro run. Planning and review are declared
      in ceremonies/ but have no workflow yet — #115.

  REQ-007:
    summary: Human-in-the-loop as decision gates, never free-text supervision
    checks:
      - {grep: {glob: "role-packs/*/templates/escalation-comment.md", pattern: "Options"}}
      - {grep: {glob: .github/workflows/dispatch.yml, pattern: "needs-human"}}
      - {exists: scripts/spend-report.py}
      - {exists: policies/gates.yaml}

  REQ-008:
    summary: Client layer — transcript to PRD, sign-offs, CRs, demos, portal
    checks:
      - {exists: portal}
      - {glob: "scripts/*transcript*"}
      - {glob: "policies/signoff*.yaml"}
    notes: Nothing built.

  REQ-009:
    summary: QA veto, DoD as policy-as-code, published QA reports
    checks:
      - {exists: scripts/qa-gate.sh}
      - {exists: scripts/qa-verdict.sh}
      - {exists: policies/dod.yaml}
      - {glob: "dashboards/qa*.py"}
    notes: The veto is enforced. QA reports are comments, not published HTML.

  REQ-010:
    summary: Environment ladder preview to prod, human gate, rollback plans
    checks:
      - {glob: ".github/workflows/deploy*.yml"}
      - {glob: "infra/**"}
      # Two proxies were tried here and both were wrong, in the same
      # direction. `policies/gates.yaml` counted because it declares the
      # merge gate — but that is REQ-007's business and says nothing about
      # an environment ladder. Then `environment:` in any workflow counted,
      # because the Pages deploy uses that key: publishing a dashboard is
      # not shipping a product. Both moved REQ-010 off zero without a line
      # of deployment existing, which is exactly the flattery this page is
      # for catching. The ladder itself has to be declared.
      - {exists: policies/environments.yaml}
    notes: >-
      No deployment of any kind exists. Still the largest untouched area.

  REQ-011:
    summary: Visibility — boards, generated dashboards, computed matrix
    checks:
      - {exists: dashboards/build.py}
      - {exists: dashboards/standup.py}
      - {exists: dashboards/status.py}
      - {glob: "dashboards/*burndown*.py"}
    notes: Traceability, standup, programme status, and burndown/velocity.

  REQ-012:
    summary: Least privilege, per-item budgets, escalation ladder
    checks:
      - {exists: scripts/read-budget.py}
      - {exists: scripts/spend-report.py}
      - {grep: {glob: "role-packs/*/policy.yaml", pattern: "cost_usd"}}
      - {grep: {glob: "role-packs/*/tools.yaml", pattern: "deny:"}}

  REQ-013:
    summary: Persistent engineering memory across ephemeral sessions
    checks:
      - {glob: "scripts/*memory*"}
      - {glob: "adapters/memory/**"}
    notes: >-
      Store built (#119): write/read/search on refs/notes/foundry. Nobody
      writes to it yet — dispatcher session-end and prompt assembly is
      #120. No MCP server (PRD §12's later phase).

  REQ-014:
    summary: Self-hosting — the system builds itself through itself
    checks:
      - {exists: .github/workflows/dispatch.yml}
      - {exists: .github/workflows/orchestrate.yml}
      - {delivered_by_agent: 1}     # a dispatched session produced a merged PR
    notes: >-
      The machinery exists and is armed. No dispatched session has yet produced
      a merged pull request, so the central claim is unproven.
