# Publish the wiki from the repository.
#
# A wiki typed into a web form drifts from the code within a sprint and then
# quietly lies to whoever reads it next. So prose lives in `wiki/` under
# review, the factual pages are computed, and this overwrites whatever is in
# the web UI on every push to main. That overwrite is the feature.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "scripts/build-wiki.py"
      - "role-packs/**"
      - "requirements/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: publish-wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Generator tests
        run: python3 scripts/test_build_wiki.py

      # The Requirements page reports real trace status rather than inventing
      # one, so it needs the traceability data built first.
      - name: Compute the traceability data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 dashboards/build.py --out "${RUNNER_TEMP}/site" --repo "${GITHUB_REPOSITORY}"

      - name: Generate the wiki
        run: |
          set -euo pipefail
          python3 scripts/build-wiki.py \
            --out "${RUNNER_TEMP}/wiki" \
            --traceability "${RUNNER_TEMP}/site/traceability.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          # A wiki has no git repository until its first page is created in
          # the web UI, and there is no API to do it. That is a setup step, not
          # a regression, so it warns rather than failing the build — a red
          # main every push would train everyone to ignore this workflow.
          if ! git ls-remote "$remote" >/dev/null 2>&1; then
            echo "::warning::The wiki has not been initialised. Create any page once at \
          https://github.com/${GITHUB_REPOSITORY}/wiki and re-run this workflow; \
          every page is generated from here afterwards."
            {
              echo "## Wiki not initialised"
              echo
              echo "GitHub creates the wiki's git repository only when the first page"
              echo "is created in the web UI, and exposes no API for it. One click at"
              echo "<https://github.com/${GITHUB_REPOSITORY}/wiki> unblocks this"
              echo "permanently — the placeholder page is overwritten on the next run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          rm -rf "${RUNNER_TEMP}/wiki-repo"
          git clone --quiet --depth 1 "$remote" "${RUNNER_TEMP}/wiki-repo"
          cd "${RUNNER_TEMP}/wiki-repo"

          # Replace wholesale: a page deleted from wiki/ must disappear here.
          git rm -rq --ignore-unmatch . || true
          cp "${RUNNER_TEMP}"/wiki/*.md .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches the repository; nothing to publish." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -qm "Publish wiki from ${GITHUB_SHA:0:7}"
          git push --quiet origin HEAD
          echo "Wiki published from ${GITHUB_SHA:0:7}." | tee -a "$GITHUB_STEP_SUMMARY"
