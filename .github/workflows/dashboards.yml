# Generated views over the program's own history, published to GitHub Pages.
#
# On main: rebuild and deploy. On a PR: build and run the tests, deploy
# nothing. The matrix changes with every merge, not only when dashboards/
# changes, so main is not path-filtered.
#
# One-time human setup: Settings → Pages → Source = "GitHub Actions".
# Without it the deploy job fails, loudly and on purpose — a dashboard that
# silently stops publishing is worse than one that visibly breaks.
name: Dashboards

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "dashboards/**"
      - "requirements/**"
      # ADRs are markdown outside dashboards/, so a new record with no
      # code change must still rebuild the page that renders it.
      - "adrs/**"
      # portal/build.py reads these directly (policies/signoff.yaml for
      # the sign-off vocabulary, signoff-check.py's classify() for state,
      # gate-check.py's is_human() underneath that) — a change to any of
      # them can change what the portal renders with no edit to portal/
      # itself.
      - "portal/**"
      - "policies/signoff.yaml"
      - "scripts/signoff-check.py"
      - "scripts/gate-check.py"
      - ".github/workflows/dashboards.yml"
  schedule:
    # 06:10 UTC daily — the standup digest ages even when nothing is pushed,
    # and a digest that only refreshes on merges would go stale exactly on
    # the days it matters most.
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the matrix reads the whole trailer history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # status.py reads requirements/coverage.yaml. The other generators
      # need nothing beyond the stdlib.
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      # Discovered, not enumerated (#128): a new dashboards/test_*.py file
      # is picked up with no edit to this workflow. Every one of them is
      # self-contained (stdlib unittest, no CLI args), so running them in
      # whatever order the shell globs them in is safe.
      - name: Generator tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dashboards/test_*.py; do
            python3 "$f"
          done

      # Standup first: build.py links whichever pages exist, so the index
      # only advertises the digest once the digest is actually on disk.
      - name: Build the standup digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 dashboards/standup.py \
            --out site --ref HEAD --repo "${GITHUB_REPOSITORY}" --window 24 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Status reads traceability.json, so the matrix builds first; build.py
      # writes the index last and links whichever pages exist.
      - name: Build the traceability matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 dashboards/build.py \
            --out site --ref HEAD --repo "${GITHUB_REPOSITORY}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Discovered, not enumerated (#128): every dashboards/*.py file is a
      # page generator invoked the same way (--out/--repo) and none of them
      # reads another's output, so the order among them doesn't matter. A
      # new one needs no workflow edit — three of the four PRs #128 names
      # were exactly this file gaining one more hardcoded step.
      # build.py and standup.py are excluded because they already ran above
      # (and below) with extra flags and a fixed position in the sequence.
      - name: Build the generated pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for gen in dashboards/*.py; do
            base="$(basename "$gen")"
            case "$base" in
              test_*.py|build.py|standup.py) continue ;;
            esac
            echo "::group::$gen"
            python3 "$gen" --out site --repo "${GITHUB_REPOSITORY}" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      # Not part of the dashboards/*.py discovery loop above: portal/ is a
      # separate audience (a paying client, not an engineer — REQ-008,
      # REQ-011) and lives outside dashboards/ on purpose. It landed with
      # its own test suite (portal/test_build.py, wired into unit-
      # tests.yml's discovery) but no generator step ever ran it, so the
      # portal existed without ever being published (#193) — the same gap
      # this file's own header warns about for a declaration with no
      # workflow behind it. Built here, before the index, so the index
      # picks it up the same way it picks up every dashboards/ page.
      - name: Build the client portal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 portal/build.py --out site --repo "${GITHUB_REPOSITORY}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Last, so the index links every page built above — including any
      # page picked up by the discovery loop, with no edit needed here.
      - name: Rebuild the index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 dashboards/build.py --out site --repo "${GITHUB_REPOSITORY}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
