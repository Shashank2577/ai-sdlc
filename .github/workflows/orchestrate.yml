# The assignment loop. Reads the board, dispatches what fits under the WIP
# limit, and says nothing when there is nothing to do.
#
# Auth: dispatching another workflow needs a token that is not GITHUB_TOKEN.
# GitHub deliberately does not let a run authenticated with GITHUB_TOKEN start
# another workflow — without that rule, a loop like this one could trigger
# itself forever.
#
# Use the Foundry GitHub App (ADR-0011: `vars.FOUNDRY_APP_CLIENT_ID` and
# `secrets.FOUNDRY_APP_PRIVATE_KEY`). FOUNDRY_TOKEN or ORCHESTRATOR_TOKEN
# (a PAT) still works until the App is set up. Without any of them, the
# loop still runs and still publishes its plan, in dry-run mode, and says
# why. A loop that fails silently every hour is worse than one that is
# visibly not armed.
#
# A dispatch the App starts reports the App as its actor, not a person.
# dispatch.yml names exactly this App in claude-code-action's
# `allowed_bots`, so the action's human-actor check admits it and no
# other bot.
name: Orchestrate

on:
  pull_request:
    # Tests only — the loop itself never runs on a PR.
    paths:
      - "scripts/assign.py"
      - "scripts/test_assign.py"
      - "role-packs/orchestrator/**"
      - "role-packs/*/pack.yaml"
      # The routing-symmetry check compares this file's role choices against
      # routing.supported, so a change here has to run it (#76).
      - ".github/workflows/dispatch.yml"
      - ".github/workflows/orchestrate.yml"
  schedule:
    # Hourly at :05. Frequent enough that a refined item does not wait long,
    # rare enough that the loop is not the noisiest thing in the repo.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the plan and dispatch nothing"
        required: false
        default: false
        type: boolean

# Read the board and start workflows. It writes nothing to the tracker and
# nothing to the repository — that asymmetry is the role.
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

concurrency:
  group: orchestrate
  cancel-in-progress: false

jobs:
  # Runs everywhere, including pull requests. Selection decides how many
  # agent sessions start; it gets checked before it is changed, not only
  # when the cron next happens to fire.
  tests:
    name: assignment-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Assignment-loop tests
        run: python3 scripts/test_assign.py

  assign:
    name: assignment-loop
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      # ADR-0011: with the Foundry GitHub App configured, its token arms
      # the loop in place of the PAT. Owner-wide, because a product item's
      # pull request lives in the product's repo, not this one. The
      # permissions mirror role-packs/orchestrator/pack.yaml's.
      - name: Mint the orchestrator's GitHub App token
        id: app_token
        if: vars.FOUNDRY_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FOUNDRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FOUNDRY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-issues: write
          permission-contents: read
          permission-pull-requests: read

      - name: Decide whether the loop is armed
        id: mode
        env:
          ORCHESTRATOR_TOKEN: ${{ steps.app_token.outputs.token || secrets.FOUNDRY_TOKEN || secrets.ORCHESTRATOR_TOKEN }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${ORCHESTRATOR_TOKEN}" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            {
              echo "> **Loop is not armed.** No Foundry GitHub App (\`FOUNDRY_APP_CLIENT_ID\`),"
              echo "> \`FOUNDRY_TOKEN\` or \`ORCHESTRATOR_TOKEN\` is set, so this run computes the plan and"
              echo "> dispatches nothing. GITHUB_TOKEN cannot start another workflow by"
              echo "> design. See the wiki: Operating the System -> Arming the system."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${REQUESTED_DRY_RUN}" = "true" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "Dry run requested; nothing will be dispatched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the loop
        env:
          # The PAT when there is one; otherwise the workflow token, which is
          # enough to read the board for a dry run.
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.FOUNDRY_TOKEN || secrets.ORCHESTRATOR_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.armed }}" = "true" ]; then
            python3 scripts/assign.py
          else
            python3 scripts/assign.py --dry-run
          fi
