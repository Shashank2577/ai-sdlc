# The assignment loop. Reads the board, dispatches what fits under the WIP
# limit, and says nothing when there is nothing to do.
#
# Auth: dispatching another workflow needs a token that is not GITHUB_TOKEN.
# GitHub deliberately does not let a run authenticated with GITHUB_TOKEN start
# another workflow — without that rule, a loop like this one could trigger
# itself forever.
#
# Use FOUNDRY_TOKEN (one PAT for the whole system); ORCHESTRATOR_TOKEN still
# works if you would rather scope this loop separately. Without either, the
# loop still runs and still publishes its plan, in dry-run mode, and says why.
# A loop that fails silently every hour is worse than one that is visibly not
# armed.
#
# A PAT belonging to a person also makes the dispatched run report
# `actor = <that person>, type = User`, which is what satisfies the
# dispatcher's human-actor check. A GitHub App token would report a bot and
# need `allowed_bots` on the action instead.
name: Orchestrate

on:
  pull_request:
    # Tests only — the loop itself never runs on a PR.
    paths:
      - "scripts/assign.py"
      - "scripts/test_assign.py"
      - "role-packs/orchestrator/**"
      - ".github/workflows/orchestrate.yml"
  schedule:
    # Hourly at :05. Frequent enough that a refined item does not wait long,
    # rare enough that the loop is not the noisiest thing in the repo.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the plan and dispatch nothing"
        required: false
        default: false
        type: boolean

# Read the board and start workflows. It writes nothing to the tracker and
# nothing to the repository — that asymmetry is the role.
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

concurrency:
  group: orchestrate
  cancel-in-progress: false

jobs:
  # Runs everywhere, including pull requests. Selection decides how many
  # agent sessions start; it gets checked before it is changed, not only
  # when the cron next happens to fire.
  tests:
    name: assignment-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Assignment-loop tests
        run: python3 scripts/test_assign.py

  assign:
    name: assignment-loop
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Decide whether the loop is armed
        id: mode
        env:
          ORCHESTRATOR_TOKEN: ${{ secrets.FOUNDRY_TOKEN || secrets.ORCHESTRATOR_TOKEN }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${ORCHESTRATOR_TOKEN}" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            {
              echo "> **Loop is not armed.** Neither \`FOUNDRY_TOKEN\` nor"
              echo "> \`ORCHESTRATOR_TOKEN\` is set, so this run computes the plan and"
              echo "> dispatches nothing. GITHUB_TOKEN cannot start another workflow by"
              echo "> design. See the wiki: Operating the System -> Arming the system."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${REQUESTED_DRY_RUN}" = "true" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "Dry run requested; nothing will be dispatched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the loop
        env:
          # The PAT when there is one; otherwise the workflow token, which is
          # enough to read the board for a dry run.
          GH_TOKEN: ${{ secrets.FOUNDRY_TOKEN || secrets.ORCHESTRATOR_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.armed }}" = "true" ]; then
            python3 scripts/assign.py
          else
            python3 scripts/assign.py --dry-run
          fi
