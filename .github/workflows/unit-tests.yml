# Every Python unit test outside dashboards/, discovered rather than named.
#
# #128: developer-role sessions cannot wire their own tests, because
# FOUNDRY_DEV_TOKEN deliberately lacks `workflow` scope. Nine PRs hit that
# handoff. #141 dissolved it for dashboards/ by globbing; this does the
# same for scripts/ and adapters/, so a new Python test file runs with no
# workflow edit and `scripts/test-wiring-allowlist.txt` stops being the
# place sessions have to fall back to.
#
# Deliberately not path-filtered. These suites are fast and self-contained,
# and a filter is one more thing that can fail to cover what it should —
# see #100, where a filter did not list the files its own tests asserted
# about, and #150's sibling problems. Running them always costs seconds.
#
# Shell suites (scripts/test-*.sh) stay wired to their own area workflows:
# several stub `gh` on PATH or need a git identity, so they are not
# uniformly safe to run in one loop. Worth revisiting once they are.
#
# The discovery itself lives in scripts/list-python-tests.sh, not inline
# here, so check-test-wiring.sh can run the exact same discovery instead of
# grepping this file for directory names. That is what closed #174: the
# enumerated comment block that used to sit at the bottom of this file,
# present only so the grep-based checker would match it, could go stale
# exactly like #171's real enumeration did while the loop stayed correct.
name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml

      # Every test_*.py in the repo except dashboards/, discovered — not
      # enumerated by directory. I wrote the first version of this file
      # listing `scripts/` and `adapters/` explicitly, before portal/
      # existed; `portal/test_build.py` then landed unwired and
      # check-test-wiring.sh went red on main (#171). That is the same
      # enumeration mistake #141 removed from dashboards.yml, reintroduced
      # by me one file later.
      #
      # dashboards/ is excluded because dashboards.yml already discovers
      # and runs those with the generators they belong to.
      #
      # File path or module path: a test inside a package (its directory
      # has __init__.py) imports by package name, so `python3 file.py`
      # fails with ModuleNotFoundError and it needs `python3 -m a.b.c`.
      # Deciding per file rather than per directory means a new package of
      # tests works with no change here.
      - name: Python tests
        run: |
          set -euo pipefail
          ran=0
          while IFS= read -r f; do
            ran=$((ran+1))
            echo "::group::$f"
            if [ -f "$(dirname "$f")/__init__.py" ]; then
              mod="${f%.py}"; python3 -m "${mod//\//.}"
            else
              python3 "$f"
            fi
            echo "::endgroup::"
          done < <(bash scripts/list-python-tests.sh)
          echo "ran $ran python test file(s)"
          [ "$ran" -gt 0 ] || { echo "::error::discovery found no test files"; exit 1; }
