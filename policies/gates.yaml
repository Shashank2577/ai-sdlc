# Human decision gates — policy as code. PRD §7, §14.
#
# The rule the human set: approval on critical things. Routine work does
# not wait, because a gate on everything is a gate nobody reads — and a
# gate nobody reads is worse than no gate, since it launders whatever
# passes through it.
#
# Enforcement is by identity, not by a second label. The `issues: labeled`
# event payload carries who applied the label, so approval is not a marker
# an agent can forge — it is the fact that a person moved the story to
# status:ready. Same insight as the dispatcher's status:ready guard, one
# level further in.
#
# One role pack may write this file: `delivery-lead`. Every other pack
# denies `policies/**`, because the gates constrain the roles and no role
# should move the thing that constrains it — but that left governance with
# no agent owner and no way to change a gate through the loop at all. The
# exception is safe only while two conditions hold, both asserted in
# `scripts/test_gate_check.py` rather than described here: every
# delivery-lead story is critical by its label alone (`governance_role`
# below), and the pack cannot merge or approve a pull request.
#
# It previously also allowed `role-packs/**`, meaning it could rewrite any
# role's budget, tool denials and write_scope — including its own. That
# made two of its own `forbidden` entries prose rather than scope, and it
# landed green because the test which catches it was path-filtered away
# from `role-packs/**` (see #100).
version: 0

gates:
  dispatch_approval:
    question: "Is this story approved to run unsupervised?"
    owner: human                    # no agent role may satisfy this gate
    # What "approved" means, mechanically.
    granted_by: a person applying `status:ready`
    # PRD §7: every gate has a default, so a silent gate cannot stall work
    # forever without anyone deciding anything.
    default_if_unanswered: remains status:needs-refinement
    sla_hours: 24
    escalates_after_sla: true

    # Routine work is dispatched on an agent's own say-so. Anything matching
    # a rule below is not.
    critical_when:
      - rule: pipeline_role
        match: {label: "role:devops"}
        because: >-
          DevOps is the only role that can edit the checks, budgets and
          dispatcher that constrain every other role. A pipeline change
          approved by the thing it governs is not a gate.

      - rule: governance_role
        match: {label: "role:delivery-lead"}
        because: >-
          Delivery Lead is the one role whose write scope includes
          `policies/**` — the gates themselves. It exists because
          governance needs an agent owner, and it is safe to have one only
          while every one of its stories is approved by a person first.
          This rule is that condition, stated where it can be checked
          rather than left to the prose rules below.

      - rule: touches_governance
        match: {text_any: ["policies/", ".github/workflows/", "branch protection",
                           "CODEOWNERS", "required check", "required status"]}
        # Only fires for a role that could actually make the change. See
        # `scoping` below.
        guards_paths: ["policies/**", ".github/workflows/**", ".github/CODEOWNERS"]
        because: >-
          These are the controls. A story proposing to change one needs a
          person to agree it should be changed, before a session spends a
          budget on it.

      - rule: touches_credentials
        match: {text_any: ["gh secret", "PAT", "token_secret", "FOUNDRY_",
                           "ANTHROPIC_API_KEY", "CLAUDE_CODE_OAUTH_TOKEN"]}
        because: >-
          Credential scope is the one privilege a required check cannot
          claw back, because the check is what a wider credential can edit.

      - rule: changes_requirements
        # Deliberately NOT "REQ-0": every story in this repo cites a REQ,
        # so it would classify the entire backlog as critical. Proposing a
        # *new* requirement or editing the index is the actual signal.
        match: {text_any: ["prds/", "requirements/index.md",
                           "requirements/coverage.yaml", "new requirement"]}
        guards_paths: ["prds/**", "requirements/**"]
        because: >-
          A REQ is a commitment. An agent proposing one is useful; an agent
          committing to one on the org's behalf is not its call.

      - rule: production_or_release
        match: {text_any: ["deploy", "production", "release tag",
                           "rollback", "environment gate"]}
        because: >-
          PRD §9: production sits behind a human gate and nothing an agent
          does unsupervised is irreversible.

      - rule: large_estimate
        match: {text_any: ["Estimate: L", "Estimate: XL"]}
        because: >-
          Not a risk rule, a cost one. Large stories are where budgets go
          and where scope quietly widens; a person should see them first.

    # A rule carrying `guards_paths` fires only when the story's role could
    # actually write one of those paths, per that role's own
    # `write_scope` in `role-packs/<role>/policy.yaml`.
    #
    # Why: word boundaries fixed matching precision but not scope, and the
    # gate drifted back to holding almost everything — 41 of 53 issues
    # (77%) at the point this was measured. `touches_governance` alone
    # fired on 50%, because this repo *is* a workflow-and-policy repo, so
    # half its stories name one. A developer story that mentions
    # `.github/workflows/` was held for approval to prevent a change the
    # developer pack denies and whose token lacks `workflow` scope — a gate
    # on something that cannot happen, and 19 points of the 77%.
    #
    # Scoping to write capability puts the gate on the same boundary as the
    # credential model rather than beside it: 31 of 53 (58%), and what
    # remains is dominated by `role:devops`, which holds the only
    # workflow-scoped token, and `role:delivery-lead`, which owns
    # `policies/**`. Both are meant to be held every time.
    #
    # Conservative on unknowns: no role label, an unrecognised role, or an
    # unreadable pack all count as capable, so a rule fires. An unrefined
    # story is exactly when least is known about it.
    scoping: write_capability

    # Stated so nobody has to infer it.
    limits: >-
      Matching is on word boundaries, not substrings. The first version of
      this policy used substrings and classified every story critical,
      because `PAT` matches inside "dispatch" — the failure this paragraph
      predicted, committed anyway. Classification reads issue text and
      labels, so it is best-effort by construction: prose can describe a
      governance change without naming one. The reliable gate is the pull request, where the diff is visible
      and CODEOWNERS can route review. This gate exists to stop a session
      being spent on work a person would not have approved, not to be
      airtight.

  merge:
    question: "Should this pull request land?"
    owner: human
    granted_by: a person pressing merge
    default_if_unanswered: stays open
    # Enforced structurally, not by prose: protected branch, admin
    # enforcement, required checks, and `gh pr merge` on every role's deny
    # list.
    enforced_by: [branch_protection, required_checks, tools_yaml_deny]

  qa_verdict:
    question: "Does this meet its acceptance criteria?"
    owner: qa                       # an agent role may satisfy this one
    granted_by: the `qa:approved` label
    # Corrected by #179. This used to read "story cannot close" — a claim
    # about a hook that does not exist. GitHub has no pre-close hook, only
    # a post-close one: close_guard (scripts/qa-verdict.sh) reopens an
    # issue closed *while carrying* qa:rejected. It has never stopped a
    # closure that carries no verdict at all, and was never designed to.
    # The first sprint-review ceremony (#178) read the old line literally,
    # found 46 closures with no verdict, and reported the veto as broken.
    # It was not broken; this line described a rule that was never
    # written. See closure_classification below for the rule that
    # actually governs "no verdict at all".
    default_if_unanswered: >-
      closes anyway. Whether that is a gap depends on the closure's shape
      — see closure_classification.
    enforced_by: [qa_gate_check, close_guard]

    # What "closed with no verdict" actually means, added by #179 to
    # replace a raw closed-story count with a classification a person can
    # act on. A verdict is only meaningful for a story that shipped code;
    # demanding one for a closure that shipped nothing would just train
    # people to rubber-stamp.
    closure_classification:
      genuine_gap:
        when: >-
          GitHub's own `stateReason` on the issue is COMPLETED, a merged
          pull request closed it, and it carries neither `qa:approved` nor
          `qa:rejected`.
        because: >-
          Code merged and nobody from QA looked at it — the exact shape
          the veto exists to catch.
      not_a_gap:
        when: >-
          `stateReason` is NOT_PLANNED, or the closing comment names the
          issue that superseded, absorbed, or already delivered this one.
        because: >-
          Split-by-ownership, superseded, and already-delivered closures
          ship no code of their own under this issue; there is nothing for
          QA to have verified.
      decision: surface, not block
      why_not_block: >-
        GitHub cannot prevent a close, only reopen after the fact — which
        close_guard already does for rejections. Applying that same
        reopen-after-the-fact mechanism to "no verdict at all" would
        reopen every legitimate not_planned/superseded/split closure too,
        on a classification rule that is still new. Surface the genuine
        gaps first; revisit blocking once the classification has run for
        a while and the false-positive rate is known.
      override: >-
        A human closing an issue always wins. Nothing in this
        classification reopens a closure — it only adds the issue to a
        report a person reads. See role-packs/qa/policy.yaml for the one
        case that *does* reopen (`verdict.blocks_closure`, qa:rejected
        only).
      measured_2026-09-04: >-
        Applied retroactively to the 47 stories #178 counted as closed in
        its window: 45 were COMPLETED (44 with no verdict, 1 — #52 —
        qa:approved) and 2 (#53, #54) were NOT_PLANNED with no merged PR.
        Of the 46 with no verdict, 44 are genuine gaps by the rule above
        and 2 are not. Full breakdown posted to #179.
