# ---------------------------------------------------------------------
# The story this file is part of (#121) also calls for
# `scripts/check-environments.py` plus tests, checking: every environment
# named above exists on the repo (via the API), `promotion_order` is a
# total order with no cycle, and every environment declares a
# `rollback.owner`. That script and its tests are application code and
# test code — `scripts/**` is not in this pack's write_scope
# (role-packs/delivery-lead/policy.yaml), which is deliberate: the role
# that can rewrite governance is not also the role that writes the code
# enforcing it. See the PR for #121 for the exact script proposed as a
# follow-up story for a role that can write `scripts/**` (developer or
# qa both can).
